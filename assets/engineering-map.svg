<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title description">
  <title id="title">Alireza Fadaei: engineering focus</title>
  <desc id="description">A visual overview of four connected areas: full-stack delivery, applied AI workflows, secure distributed systems, and research and optimisation.</desc>
  <defs>
